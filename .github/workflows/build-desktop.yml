name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Windows x64
            runner: windows-latest
          - name: macOS Intel
            runner: macos-13
          - name: macOS Apple Silicon
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python desktop build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[desktop]"

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build installer
        run: npm run build
        env:
          BUILD_DESKTOP: "true"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cloudnex-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14